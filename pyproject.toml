[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-bot"
version = "0.1.0"
description = "Autonomous self-improving trading bot: data -> replay -> strategy -> risk -> execution -> journal -> AI review -> improvement"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.23", "pydantic>=2.0"]
mt5 = ["MetaTrader5>=5.0"]
db = ["psycopg[binary]>=3.1", "supabase>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: end-to-end / long-running integration tests",
]
